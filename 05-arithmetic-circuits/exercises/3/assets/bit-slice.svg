<text x="54" y="473" text-anchor="start" style="fill:#1E40AF;font-size:18px;font-weight:400">Xᵢ และ Yᵢ ไม่เป็น 1 พร้อมกัน เพราะ K·K̅ = 0; เมื่อ C₀ = 0 ตัวทดทุกบิตจึงเป็น 0</text>
