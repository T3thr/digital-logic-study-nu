<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">วงจรย่อยหนึ่งบิต</title><desc id="desc">Ai และ Bi ผ่าน XOR และ AND ก่อนเข้าเซลล์บวกหนึ่งบิต; ผลบวก OR กับ G; ตัวทดเข้าศูนย์และตัวทดออกศูนย์</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs>
