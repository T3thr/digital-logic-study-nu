<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">วงจรหลายฟังก์ชัน 4 บิตด้วย 74283</title><desc id="desc">สองฝั่ง XOR กับ J แล้ว AND เลือกด้วย K; เข้า 74283 โดย C0 เท่ากับ 0; ผลบวก OR กับ G ทั้ง 4 บิต</desc>
